<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login • EventFlow</title>
  <style>
    :root {
      --bg-dark: #050505;
      --neon-blue: #00f2ff;
      --neon-purple: #7000ff;
      --flame: #ff4d00;
      --text-light: #e0e0e0;
    }

    body {
      font-family: 'Orbitron', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: var(--bg-dark);
      color: var(--text-light);
      margin: 0;
    }

    .login-box {
      background: #111;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 20px var(--neon-purple);
      width: 300px;
      text-align: center;
    }

    .login-box h2 {
      margin-bottom: 1rem;
      color: var(--neon-blue);
    }

    input {
      width: 100%;
      padding: 0.5rem;
      margin: 0.5rem 0;
      border: 1px solid var(--neon-purple);
      border-radius: 4px;
      background: #222;
      color: var(--text-light);
    }
    input:focus {
      outline: none;
      border-color: var(--neon-blue);
      box-shadow: 0 0 10px var(--neon-blue);
    }

    button {
      width: 100%;
      padding: 0.75rem;
      background: transparent;
      color: var(--neon-blue);
      border: 2px solid var(--neon-blue);
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }
    button:hover {
      background: var(--neon-blue);
      color: #000;
      box-shadow: 0 0 15px var(--neon-blue);
    }

    #error {
      color: var(--flame);
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Admin Login</h2>
    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <p id="error"></p>
  </div>

  <script>
    function login() {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;

      // Simple hardcoded check (replace with backend validation in production)
           if (user === "eventflow134" && pass === "password")
        sessionStorage.setItem("isAdmin", "true");
        window.location.href = "admin.html";
      } else {
        document.getElementById('error').textContent = "Invalid credentials!";
      }
    }
  </script>
</body>
</html>
